<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>ScreenShare</title>
    <style>
      :root {
        --bg: #313338;
        --surface: #2b2d31;
        --text: #f2f3f5;
        --muted: #b5bac1;
        --blurple: #5865f2;
        --blurple-hover: #4752c4;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.45; }
      button {
        -webkit-app-region: no-drag;
        border: 0;
        border-radius: 4px;
        padding: 10px 20px;
        background: var(--blurple);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 150ms ease;
      }
      button:hover { background: var(--blurple-hover); }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sem conexão com o servidor</h1>
      <p>Não foi possível abrir o ScreenShare. Verifique sua internet ou se o servidor está ligado.</p>
      <button id="retry" type="button">Tentar de novo</button>
    </main>
    <script>
      // The main process passes the page to go back to; only http(s) targets are honored.
      const target = new URLSearchParams(location.search).get("target") || "";
      document.getElementById("retry").addEventListener("click", () => {
        if (/^https?:\/\//.test(target)) location.href = target;
      });
    </script>
  </body>
</html>
